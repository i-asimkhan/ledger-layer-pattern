<rect width="1200" height="500" fill="#FFFFFF"/>
<text x="40" y="50.9" text-anchor="start" font-size="34" font-weight="700" fill="#111827">Independent audit sits outside the teams that build</text>
<rect x="40" y="90" width="830" height="80" rx="14" fill="#F3F4F6" fill-opacity="1" stroke="#6B7280" stroke-width="3"/>
<text x="455.0" y="124.2" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">GOVERNING BODY</text>
<text x="455.0" y="155.9" text-anchor="middle" font-size="24" font-weight="400" fill="#111827">oversight; backs independent audit</text>
<rect x="40" y="240" width="320" height="140" rx="14" fill="#F3F4F6" fill-opacity="1" stroke="#6B7280" stroke-width="3"/>
<text x="200.0" y="288.6" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">FIRST LINE</text>
<text x="200.0" y="320.3" text-anchor="middle" font-size="24" font-weight="400" fill="#111827">Build teams deliver the work</text>
<text x="200.0" y="351.5" text-anchor="middle" font-size="24" font-weight="400" fill="#111827">and write the records</text>
<rect x="385" y="240" width="320" height="140" rx="14" fill="#E2E8F0" fill-opacity="1" stroke="#334155" stroke-width="3"/>
<text x="545.0" y="288.6" text-anchor="middle" font-size="28" font-weight="700" fill="#0F172A">SECOND LINE</text>
<text x="545.0" y="320.3" text-anchor="middle" font-size="24" font-weight="400" fill="#0F172A">Platform, security, risk:</text>
<text x="545.0" y="351.5" text-anchor="middle" font-size="24" font-weight="400" fill="#0F172A">set controls, watch them</text>
<rect x="730" y="240" width="260" height="140" rx="14" fill="#FEE2E2" fill-opacity="1" stroke="#DC2626" stroke-width="3"/>
<text x="860.0" y="288.6" text-anchor="middle" font-size="28" font-weight="700" fill="#7F1D1D">THIRD LINE</text>
<text x="860.0" y="320.3" text-anchor="middle" font-size="24" font-weight="400" fill="#7F1D1D">Independent audit:</text>
<text x="860.0" y="351.5" text-anchor="middle" font-size="24" font-weight="400" fill="#7F1D1D">checks record vs. work</text>
<rect x="1015" y="90" width="150" height="290" rx="14" fill="#FEE2E2" fill-opacity="1" stroke="#DC2626" stroke-width="3"/>
<text x="1090.0" y="186.2" text-anchor="middle" font-size="24" font-weight="700" fill="#7F1D1D">EXTERNAL</text>
<text x="1090.0" y="214.8" text-anchor="middle" font-size="22" font-weight="400" fill="#7F1D1D">AUDITORS</text>
<text x="1090.0" y="243.4" text-anchor="middle" font-size="22" font-weight="400" fill="#7F1D1D">for high-</text>
<text x="1090.0" y="272.0" text-anchor="middle" font-size="22" font-weight="400" fill="#7F1D1D">sensitivity</text>
<text x="1090.0" y="300.6" text-anchor="middle" font-size="22" font-weight="400" fill="#7F1D1D">work</text>
