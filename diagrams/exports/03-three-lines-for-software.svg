<text x="40" y="55.9" text-anchor="start" font-size="34" font-weight="700" fill="#111827">Independent audit sits outside the teams that build</text>
<rect x="230" y="95" width="640" height="80" rx="14" fill="#F3F4F6" stroke="#6B7280" stroke-width="3"/>
<text x="550.0" y="129.2" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">GOVERNING BODY</text>
<text x="550.0" y="160.9" text-anchor="middle" font-size="24" font-weight="400" fill="#111827">oversight; backs independent audit</text>
<rect x="40" y="225" width="320" height="150" rx="14" fill="#F3F4F6" stroke="#6B7280" stroke-width="3"/>
<text x="200.0" y="278.6" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">FIRST LINE</text>
<text x="200.0" y="310.3" text-anchor="middle" font-size="24" font-weight="400" fill="#111827">Build teams deliver the work</text>
<text x="200.0" y="341.5" text-anchor="middle" font-size="24" font-weight="400" fill="#111827">and write the records</text>
<rect x="385" y="225" width="320" height="150" rx="14" fill="#E2E8F0" stroke="#334155" stroke-width="3"/>
<text x="545.0" y="278.6" text-anchor="middle" font-size="28" font-weight="700" fill="#0F172A">SECOND LINE</text>
<text x="545.0" y="310.3" text-anchor="middle" font-size="24" font-weight="400" fill="#0F172A">Platform, security, risk:</text>
<text x="545.0" y="341.5" text-anchor="middle" font-size="24" font-weight="400" fill="#0F172A">set controls, watch them</text>
<rect x="730" y="225" width="260" height="150" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/>
<text x="860.0" y="278.6" text-anchor="middle" font-size="28" font-weight="700" fill="#7F1D1D">THIRD LINE</text>
<text x="860.0" y="310.3" text-anchor="middle" font-size="24" font-weight="400" fill="#7F1D1D">Independent audit:</text>
<text x="860.0" y="341.5" text-anchor="middle" font-size="24" font-weight="400" fill="#7F1D1D">checks record vs. work</text>
<rect x="1015" y="95" width="145" height="280" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
<text x="1087.5" y="186.2" text-anchor="middle" font-size="24" font-weight="700" fill="#78350F">EXTERNAL</text>
<text x="1087.5" y="214.8" text-anchor="middle" font-size="22" font-weight="400" fill="#78350F">AUDITORS</text>
<text x="1087.5" y="243.4" text-anchor="middle" font-size="22" font-weight="400" fill="#78350F">for high-</text>
<text x="1087.5" y="272.0" text-anchor="middle" font-size="22" font-weight="400" fill="#78350F">sensitivity</text>
<text x="1087.5" y="300.6" text-anchor="middle" font-size="22" font-weight="400" fill="#78350F">work</text>
<polyline points="450,175 200,225" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round" marker-end="url(#m334155)"/>
<polyline points="550,175 545,225" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round" marker-end="url(#m334155)"/>
<polyline points="800,175 860,225" fill="none" stroke="#DC2626" stroke-width="4" stroke-linejoin="round" marker-end="url(#mDC2626)"/>
<text x="40" y="439.8" text-anchor="start" font-size="28" font-weight="700" fill="#111827">Audit reports to the governing body, not to the teams it audits.</text>
<text x="40" y="495.7" text-anchor="start" font-size="22" font-weight="400" fill="#4B5563">Software mapping of the IIA Three Lines Model (2020). Teams and titles vary by organisation.</text>
</svg>