<text x="600.0" y="449.2" text-anchor="middle" font-size="22" font-weight="400" fill="#0F172A">matches? else refused</text>
<rect x="40" y="352" width="310" height="118" rx="14" fill="#CCFBF1" fill-opacity="1" stroke="#0D9488" stroke-width="3"/>
<text x="195.0" y="405.8" text-anchor="middle" font-size="26" font-weight="700" fill="#134E4A">6  MERGE</text>
