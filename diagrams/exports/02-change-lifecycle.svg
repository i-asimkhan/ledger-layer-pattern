<text x="40" y="71.9" text-anchor="start" font-size="32" font-weight="700" fill="#111827">One change: drafted, signed by its builder,</text>
<text x="40" y="113.5" text-anchor="start" font-size="32" font-weight="700" fill="#111827">then audited before it can merge</text>
<rect x="40" y="140" width="310" height="118" rx="14" fill="#F3F4F6" fill-opacity="1" stroke="#6B7280" stroke-width="3"/>
<text x="195.0" y="193.8" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">1  BUILDER</text>
<text x="195.0" y="222.9" text-anchor="middle" font-size="22" font-weight="400" fill="#111827">changes the code</text>
<rect x="445" y="140" width="310" height="118" rx="14" fill="#EDE9FE" fill-opacity="1" stroke="#7C3AED" stroke-width="3"/>
<text x="600.0" y="179.5" text-anchor="middle" font-size="26" font-weight="700" fill="#2E1065">2  LEDGER</text>
<text x="600.0" y="208.7" text-anchor="middle" font-size="22" font-weight="400" fill="#2E1065">drafts record, diagram,</text>
<text x="600.0" y="237.2" text-anchor="middle" font-size="22" font-weight="400" fill="#2E1065">spec link and hash</text>
<rect x="850" y="140" width="310" height="118" rx="14" fill="#FEF3C7" fill-opacity="1" stroke="#D97706" stroke-width="3"/>
<text x="1005.0" y="193.8" text-anchor="middle" font-size="26" font-weight="700" fill="#78350F">3  BUILDER SIGNS</text>
<text x="1005.0" y="222.9" text-anchor="middle" font-size="22" font-weight="400" fill="#78350F">reviews, edits, attests</text>
<rect x="850" y="352" width="310" height="118" rx="14" fill="#FEE2E2" fill-opacity="1" stroke="#DC2626" stroke-width="3"/>
<text x="1005.0" y="391.5" text-anchor="middle" font-size="26" font-weight="700" fill="#7F1D1D">4  AUDITOR</text>
<text x="1005.0" y="420.6" text-anchor="middle" font-size="22" font-weight="400" fill="#7F1D1D">consistency, explain-back,</text>
<text x="1005.0" y="449.2" text-anchor="middle" font-size="22" font-weight="400" fill="#7F1D1D">stress tests</text>
<rect x="445" y="352" width="310" height="118" rx="14" fill="#E2E8F0" fill-opacity="1" stroke="#334155" stroke-width="3"/>
