<rect width="1200" height="627" fill="#FFFFFF"/>
<text x="40" y="50.2" text-anchor="start" font-size="32" font-weight="700" fill="#111827">Transition now, transformation later: one risky area first</text>
<text x="40" y="116.1" text-anchor="start" font-size="26" font-weight="700" fill="#134E4A">TRANSITION (now)</text>
<polyline points="40,136 770,136" fill="none" stroke="#0D9488" stroke-width="5" stroke-linejoin="round" marker-end="url(#m0D9488)"/>
<text x="820" y="116.1" text-anchor="start" font-size="26" font-weight="700" fill="#2E1065">TRANSFORMATION (later)</text>
<polyline points="820,136 1160,136" fill="none" stroke="#7C3AED" stroke-width="5" stroke-linejoin="round" marker-end="url(#m7C3AED)"/>
<rect x="40" y="160" width="340" height="300" rx="14" fill="#CCFBF1" fill-opacity="1" stroke="#0D9488" stroke-width="3"/>
<text x="210.0" y="254.8" text-anchor="middle" font-size="28" font-weight="700" fill="#134E4A">NOW</text>
<text x="210.0" y="287.5" text-anchor="middle" font-size="25" font-weight="400" fill="#134E4A">Pick one risky area.</text>
<text x="210.0" y="320.0" text-anchor="middle" font-size="25" font-weight="400" fill="#134E4A">Add the Ledger layer</text>
<text x="210.0" y="352.5" text-anchor="middle" font-size="25" font-weight="400" fill="#134E4A">and a separate audit</text>
<text x="210.0" y="385.0" text-anchor="middle" font-size="25" font-weight="400" fill="#134E4A">team there.</text>
<rect x="430" y="160" width="340" height="300" rx="14" fill="#CCFBF1" fill-opacity="1" stroke="#0D9488" stroke-width="3"/>
<text x="600.0" y="254.8" text-anchor="middle" font-size="28" font-weight="700" fill="#134E4A">NEXT</text>
<text x="600.0" y="287.5" text-anchor="middle" font-size="25" font-weight="400" fill="#134E4A">Mirror audit roles at</text>
<text x="600.0" y="320.0" text-anchor="middle" font-size="25" font-weight="400" fill="#134E4A">every stage. Audit</text>
<text x="600.0" y="352.5" text-anchor="middle" font-size="25" font-weight="400" fill="#134E4A">becomes a career path</text>
<text x="600.0" y="385.0" text-anchor="middle" font-size="25" font-weight="400" fill="#134E4A">for new graduates.</text>
<rect x="820" y="160" width="340" height="300" rx="14" fill="#EDE9FE" fill-opacity="1" stroke="#7C3AED" stroke-width="3" stroke-dasharray="10 6"/>
<text x="990.0" y="238.6" text-anchor="middle" font-size="28" font-weight="700" fill="#2E1065">LATER: 10-20 years</text>
<text x="990.0" y="271.2" text-anchor="middle" font-size="25" font-weight="400" fill="#2E1065">Common practice.</text>
<text x="990.0" y="303.8" text-anchor="middle" font-size="25" font-weight="400" fill="#2E1065">More reviewers, fewer</text>
<text x="990.0" y="336.2" text-anchor="middle" font-size="25" font-weight="400" fill="#2E1065">builders; most checking</text>
<text x="990.0" y="368.8" text-anchor="middle" font-size="25" font-weight="400" fill="#2E1065">automated.</text>
<text x="990.0" y="401.2" text-anchor="middle" font-size="25" font-weight="400" fill="#2E1065">Author&#x27;s opinion.</text>
<polyline points="380,310 430,310" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round" marker-end="url(#m334155)"/>
<polyline points="770,310 820,310" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round" marker-end="url(#m334155)"/>
<text x="40" y="532.5" text-anchor="start" font-size="30" font-weight="700" fill="#111827">Nobody audits their own work, at any stage.</text>
<text x="40" y="580.4" text-anchor="start" font-size="24" font-weight="400" fill="#4B5563">The 10-20 year view is the author&#x27;s opinion, not a finding.</text>
</svg>