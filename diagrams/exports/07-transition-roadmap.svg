<rect width="1200" height="627" fill="#FFFFFF"/>
<text x="40" y="72.2" text-anchor="start" font-size="32" font-weight="700" fill="#111827">Transition now, transformation later: one risky area first</text>
<text x="40" y="118.7" text-anchor="start" font-size="22" font-weight="700" fill="#134E4A">TRANSITION (now)</text>
<polyline points="40,138 770,138" fill="none" stroke="#0D9488" stroke-width="5" stroke-linejoin="round" marker-end="url(#m0D9488)"/>
<text x="820" y="118.7" text-anchor="start" font-size="22" font-weight="700" fill="#2E1065">TRANSFORMATION (later)</text>
<polyline points="820,138 1160,138" fill="none" stroke="#7C3AED" stroke-width="5" stroke-linejoin="round" marker-end="url(#m7C3AED)"/>
<rect x="40" y="166" width="330" height="290" rx="14" fill="#CCFBF1" fill-opacity="1" stroke="#0D9488" stroke-width="3"/>
<text x="205.0" y="260.3" text-anchor="middle" font-size="26" font-weight="700" fill="#134E4A">NOW</text>
<text x="205.0" y="290.4" text-anchor="middle" font-size="23" font-weight="400" fill="#134E4A">Pick one risky area.</text>
<text x="205.0" y="320.3" text-anchor="middle" font-size="23" font-weight="400" fill="#134E4A">Add the Ledger layer</text>
<text x="205.0" y="350.2" text-anchor="middle" font-size="23" font-weight="400" fill="#134E4A">and a separate audit</text>
<text x="205.0" y="380.1" text-anchor="middle" font-size="23" font-weight="400" fill="#134E4A">team there.</text>
<rect x="435" y="166" width="330" height="290" rx="14" fill="#CCFBF1" fill-opacity="1" stroke="#0D9488" stroke-width="3"/>
<text x="600.0" y="260.3" text-anchor="middle" font-size="26" font-weight="700" fill="#134E4A">NEXT</text>
<text x="600.0" y="290.4" text-anchor="middle" font-size="23" font-weight="400" fill="#134E4A">Mirror audit roles at</text>
<text x="600.0" y="320.3" text-anchor="middle" font-size="23" font-weight="400" fill="#134E4A">every stage. Audit</text>
<text x="600.0" y="350.2" text-anchor="middle" font-size="23" font-weight="400" fill="#134E4A">becomes a career path</text>
<text x="600.0" y="380.1" text-anchor="middle" font-size="23" font-weight="400" fill="#134E4A">for new graduates.</text>
<rect x="830" y="166" width="330" height="290" rx="14" fill="#EDE9FE" fill-opacity="1" stroke="#7C3AED" stroke-width="3" stroke-dasharray="10 6"/>
<text x="995.0" y="262.9" text-anchor="middle" font-size="26" font-weight="700" fill="#2E1065">LATER: 10-20 years</text>
<text x="995.0" y="292.1" text-anchor="middle" font-size="22" font-weight="400" fill="#2E1065">Common practice. More</text>
<text x="995.0" y="320.7" text-anchor="middle" font-size="22" font-weight="400" fill="#2E1065">reviewers, fewer builders;</text>
<text x="995.0" y="349.2" text-anchor="middle" font-size="22" font-weight="400" fill="#2E1065">most checking automated.</text>
<text x="995.0" y="377.9" text-anchor="middle" font-size="22" font-weight="400" fill="#2E1065">Author&#x27;s opinion.</text>
<polyline points="370,311.0 435,311.0" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round" marker-end="url(#m334155)"/>
<polyline points="765,311.0 830,311.0" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round" marker-end="url(#m334155)"/>
<text x="40" y="514.8" text-anchor="start" font-size="28" font-weight="700" fill="#111827">Nobody audits their own work, at any stage.</text>
<text x="40" y="556.0" text-anchor="start" font-size="20" font-weight="400" fill="#4B5563">The 10-20 year view is the author&#x27;s opinion, not a finding.</text>
</svg>