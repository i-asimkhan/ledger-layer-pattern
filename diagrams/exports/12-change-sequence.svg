<text x="480.0" y="642.0" text-anchor="middle" font-size="17" font-weight="700" fill="#DC2626">11  refused: back to the builder</text>
<text x="40" y="703.0" text-anchor="start" font-size="20" font-weight="400" fill="#4B5563">The gate reads the policy from the base branch, so a change cannot loosen its own gate.</text>
