<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<defs>
</defs>
<rect width="1200" height="690" fill="#FFFFFF"/>
<text x="40" y="72.2" text-anchor="start" font-size="32" font-weight="700" fill="#111827">One record: what was decided, who signed it, who checked it</text>
<rect x="40" y="100" width="1120" height="506" rx="12" fill="#F0FDFA" fill-opacity="1" stroke="#0D9488" stroke-opacity="1" stroke-width="3"/>
<text x="64" y="137.7" text-anchor="start" font-size="22" font-weight="700" fill="#134E4A">THE RECORD: one Markdown file in the repo</text>
<rect x="64" y="160" width="1072" height="90" rx="14" fill="#E2E8F0" fill-opacity="1" stroke="#334155" stroke-width="3"/>
<text x="600.0" y="199.1" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">REVERSIBILITY: easy, hard, or cannot be undone</text>
<text x="600.0" y="227.7" text-anchor="middle" font-size="22" font-weight="400" fill="#0F172A">sets how deep the audit goes</text>
<rect x="64.0" y="274" width="341.3333333333333" height="308" rx="14" fill="#EDE9FE" fill-opacity="1" stroke="#7C3AED" stroke-width="3"/>
<text x="234.66666666666666" y="365.6" text-anchor="middle" font-size="26" font-weight="700" fill="#2E1065">DECISION</text>
<text x="234.66666666666666" y="394.8" text-anchor="middle" font-size="22" font-weight="400" fill="#2E1065">drafted by the Ledger</text>
<text x="234.66666666666666" y="423.4" text-anchor="middle" font-size="22" font-weight="400" fill="#2E1065">context, decision,</text>
<text x="234.66666666666666" y="451.9" text-anchor="middle" font-size="22" font-weight="400" fill="#2E1065">alternatives,</text>
<text x="234.66666666666666" y="480.6" text-anchor="middle" font-size="22" font-weight="400" fill="#2E1065">consequences</text>
<text x="234.66666666666666" y="509.1" text-anchor="middle" font-size="22" font-weight="400" fill="#2E1065">spec link, change hash</text>
<rect x="429.3333333333333" y="274" width="341.3333333333333" height="308" rx="14" fill="#FEF3C7" fill-opacity="1" stroke="#D97706" stroke-width="3"/>
<text x="600.0" y="365.6" text-anchor="middle" font-size="26" font-weight="700" fill="#78350F">ATTESTED</text>
<text x="600.0" y="394.8" text-anchor="middle" font-size="22" font-weight="400" fill="#78350F">signed by the builder</text>
<text x="600.0" y="423.4" text-anchor="middle" font-size="22" font-weight="400" fill="#78350F">name and date</text>
<text x="600.0" y="451.9" text-anchor="middle" font-size="22" font-weight="400" fill="#78350F">edited by builder:</text>
<text x="600.0" y="480.6" text-anchor="middle" font-size="22" font-weight="400" fill="#78350F">yes or no</text>
<text x="600.0" y="509.1" text-anchor="middle" font-size="22" font-weight="400" fill="#78350F">(no is flagged)</text>
<rect x="794.6666666666666" y="274" width="341.3333333333333" height="308" rx="14" fill="#FEE2E2" fill-opacity="1" stroke="#DC2626" stroke-width="3"/>
<text x="965.3333333333333" y="365.6" text-anchor="middle" font-size="26" font-weight="700" fill="#7F1D1D">AUDIT</text>
<text x="965.3333333333333" y="394.8" text-anchor="middle" font-size="22" font-weight="400" fill="#7F1D1D">by a different person</text>
<text x="965.3333333333333" y="423.4" text-anchor="middle" font-size="22" font-weight="400" fill="#7F1D1D">consistency check</text>
<text x="965.3333333333333" y="451.9" text-anchor="middle" font-size="22" font-weight="400" fill="#7F1D1D">explain-back note</text>
<text x="965.3333333333333" y="480.6" text-anchor="middle" font-size="22" font-weight="400" fill="#7F1D1D">stress test result</text>
<text x="965.3333333333333" y="509.1" text-anchor="middle" font-size="22" font-weight="400" fill="#7F1D1D">status and date</text>
<text x="40" y="640.0" text-anchor="start" font-size="20" font-weight="400" fill="#4B5563">Example fields. See templates/decision-record.md.</text>
</svg>