<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<defs>
<marker id="m334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
</defs>
<rect width="1200" height="627" fill="#FFFFFF"/>
<text x="40" y="72.2" text-anchor="start" font-size="32" font-weight="700" fill="#111827">Classic MVC: three layers, none of them remembers why</text>
<text x="40" y="155.4" text-anchor="start" font-size="22" font-weight="400" fill="#4B5563">The picture most of us learned: the user interacts with the View, the View sends</text>
<text x="40" y="184.0" text-anchor="start" font-size="22" font-weight="400" fill="#4B5563">input to the Controller, the Controller updates the Model, the Model notifies the View.</text>
<rect x="40" y="346" width="110" height="58" rx="14" fill="#F3F4F6" fill-opacity="1" stroke="#6B7280" stroke-width="3"/>
<text x="95.0" y="382.7" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">User</text>
<rect x="280" y="346" width="180" height="58" rx="14" fill="#F3F4F6" fill-opacity="1" stroke="#6B7280" stroke-width="3"/>
<text x="370.0" y="383.4" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">View</text>
<rect x="280" y="460" width="180" height="58" rx="14" fill="#F3F4F6" fill-opacity="1" stroke="#6B7280" stroke-width="3"/>
<text x="370.0" y="496.7" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Controller</text>
<rect x="550" y="460" width="140" height="58" rx="14" fill="#F3F4F6" fill-opacity="1" stroke="#6B7280" stroke-width="3"/>
<text x="620.0" y="497.4" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">Model</text>
<polyline points="150,375 280,375" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round" marker-end="url(#m334155)"/>
<rect x="169.5" y="341" width="91" height="26" rx="6" fill="#FFFFFF"/>
<text x="215.0" y="359.9" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">interacts</text>
<polyline points="370,404 370,460" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round" marker-end="url(#m334155)"/>
<rect x="382" y="419.0" width="109" height="26" rx="6" fill="#FFFFFF"/>
<text x="436.5" y="437.9" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">sends input</text>
<polyline points="460,489 550,489" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round" marker-end="url(#m334155)"/>
<rect x="472.0" y="455" width="66" height="26" rx="6" fill="#FFFFFF"/>
<text x="505.0" y="473.2" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">updates</text>
<polyline points="620,460 620,386 460,386" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round" marker-end="url(#m334155)"/>
<rect x="632" y="416.0" width="82" height="26" rx="6" fill="#FFFFFF"/>
<text x="673.0" y="434.9" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">notifies</text>
<text x="780" y="393.6" text-anchor="start" font-size="24" font-weight="400" fill="#111827">Nothing in this picture</text>
<text x="780" y="424.8" text-anchor="start" font-size="24" font-weight="400" fill="#111827">records why a change was</text>
<text x="780" y="456.0" text-anchor="start" font-size="24" font-weight="400" fill="#111827">made, who signed it, or</text>
<text x="780" y="487.2" text-anchor="start" font-size="24" font-weight="400" fill="#111827">who checked it.</text>
<text x="40" y="578.0" text-anchor="start" font-size="20" font-weight="700" fill="#111827">Same layers, same arrows in the next picture. Watch what gets added.</text>
</svg>