<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<defs>
<marker id="mDC2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
</defs>
<rect width="1200" height="627" fill="#FFFFFF"/>
<text x="40" y="72.2" text-anchor="start" font-size="32" font-weight="700" fill="#111827">Independence grows with risk: one pattern, three sizes</text>
<text x="40" y="117.7" text-anchor="start" font-size="22" font-weight="700" fill="#7F1D1D">more independence, deeper audit</text>
<polyline points="40,140 1160,140" fill="none" stroke="#DC2626" stroke-width="5" stroke-linejoin="round" marker-end="url(#mDC2626)"/>
<rect x="40" y="344" width="354" height="170" rx="14" fill="#FEE2E2" fill-opacity="1" stroke="#DC2626" stroke-width="3"/>
<text x="217.0" y="396.4" text-anchor="middle" font-size="24" font-weight="700" fill="#7F1D1D">SMALL TEAM</text>
<text x="217.0" y="424.1" text-anchor="middle" font-size="21" font-weight="400" fill="#7F1D1D">Internal audit by someone</text>
<text x="217.0" y="451.4" text-anchor="middle" font-size="21" font-weight="400" fill="#7F1D1D">who did not build it</text>
<text x="217.0" y="478.7" text-anchor="middle" font-size="21" font-weight="400" fill="#7F1D1D">Independence: technical</text>
<rect x="423" y="254" width="354" height="260" rx="14" fill="#FEE2E2" fill-opacity="1" stroke="#DC2626" stroke-width="3"/>
<text x="600.0" y="337.8" text-anchor="middle" font-size="24" font-weight="700" fill="#7F1D1D">LARGE ORGANISATION</text>
<text x="600.0" y="365.4" text-anchor="middle" font-size="21" font-weight="400" fill="#7F1D1D">A separate audit function</text>
<text x="600.0" y="392.7" text-anchor="middle" font-size="21" font-weight="400" fill="#7F1D1D">reporting outside delivery</text>
<text x="600.0" y="420.0" text-anchor="middle" font-size="21" font-weight="400" fill="#7F1D1D">Independence: technical,</text>
<text x="600.0" y="447.3" text-anchor="middle" font-size="21" font-weight="400" fill="#7F1D1D">managerial, financial</text>
<rect x="806" y="164" width="354" height="350" rx="14" fill="#FEE2E2" fill-opacity="1" stroke="#DC2626" stroke-width="3"/>
<text x="983.0" y="279.1" text-anchor="middle" font-size="24" font-weight="700" fill="#7F1D1D">HIGH SENSITIVITY</text>
<text x="983.0" y="306.8" text-anchor="middle" font-size="21" font-weight="400" fill="#7F1D1D">Add external auditors</text>
<text x="983.0" y="334.1" text-anchor="middle" font-size="21" font-weight="400" fill="#7F1D1D">Scope pinned to an</text>
<text x="983.0" y="361.4" text-anchor="middle" font-size="21" font-weight="400" fill="#7F1D1D">exact version of the code</text>
<text x="983.0" y="388.6" text-anchor="middle" font-size="21" font-weight="400" fill="#7F1D1D">Independence: all three,</text>
<text x="983.0" y="415.9" text-anchor="middle" font-size="21" font-weight="400" fill="#7F1D1D">plus outside assurance</text>
<text x="40" y="555.6" text-anchor="start" font-size="18" font-weight="400" fill="#4B5563">Independence terms follow IV&amp;V: technical, managerial, financial.</text>
<text x="40" y="579.0" text-anchor="start" font-size="18" font-weight="400" fill="#4B5563">Where a team is too small, one auditor may cover several stages.</text>
</svg>