<text x="710.0" y="419.6" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">notifies</text>
<text x="40" y="478.8" text-anchor="start" font-size="24" font-weight="400" fill="#111827">Nothing in this picture records why a change was made,</text>
<text x="40" y="510.0" text-anchor="start" font-size="24" font-weight="400" fill="#111827">who signed it, or who checked it.</text>
<text x="40" y="578.0" text-anchor="start" font-size="20" font-weight="700" fill="#111827">Same layers, same arrows in the next picture.</text>
