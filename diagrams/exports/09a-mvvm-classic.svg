<rect x="274.5" y="401" width="111" height="26" rx="6" fill="#FFFFFF"/>
<text x="330.0" y="419.6" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">data binding</text>
<polyline points="640,364 780,364" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round" marker-end="url(#m334155)"/>
