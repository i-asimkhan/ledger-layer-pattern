<rect width="1200" height="627" fill="#FFFFFF"/>
<text x="40" y="50.9" text-anchor="start" font-size="34" font-weight="700" fill="#111827">Classic MVVM: data binding, and still no memory of why</text>
<text x="40" y="137.8" text-anchor="start" font-size="24" font-weight="400" fill="#4B5563">The View binds to the ViewModel, which calls the Model and is notified of changes.</text>
<text x="40" y="169.0" text-anchor="start" font-size="24" font-weight="400" fill="#4B5563">A different pattern from MVC, the same gap: nothing records the reasoning.</text>
<rect x="40" y="262" width="240" height="80" rx="14" fill="#F3F4F6" fill-opacity="1" stroke="#6B7280" stroke-width="3"/>
<text x="160.0" y="311.8" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">View</text>
<rect x="400" y="262" width="240" height="80" rx="14" fill="#F3F4F6" fill-opacity="1" stroke="#6B7280" stroke-width="3"/>
<text x="520.0" y="311.8" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">ViewModel</text>
<rect x="760" y="262" width="240" height="80" rx="14" fill="#F3F4F6" fill-opacity="1" stroke="#6B7280" stroke-width="3"/>
<text x="880.0" y="311.8" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">Model</text>
<polyline points="280,284 400,284" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round" marker-end="url(#m334155)"/>
<text x="340.0" y="270.3" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">commands</text>
<polyline points="400,322 280,322" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round" marker-end="url(#m334155)"/>
<text x="340.0" y="358.3" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">data binding</text>
<polyline points="640,284 760,284" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round" marker-end="url(#m334155)"/>
<text x="700.0" y="270.3" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">calls</text>
<polyline points="760,322 640,322" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round" marker-end="url(#m334155)"/>
<text x="700.0" y="358.3" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">notifies</text>
<text x="40" y="451.6" text-anchor="start" font-size="28" font-weight="400" fill="#111827">Nothing in this picture records why a change was made,</text>
<text x="40" y="488.0" text-anchor="start" font-size="28" font-weight="400" fill="#111827">who signed it, or who checked it.</text>
<text x="30" y="588.4" text-anchor="start" font-size="24" font-weight="700" fill="#111827">Same layers, same arrows in the next picture.</text>
</svg>