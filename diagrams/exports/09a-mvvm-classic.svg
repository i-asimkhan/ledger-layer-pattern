<text x="40" y="72.2" text-anchor="start" font-size="32" font-weight="700" fill="#111827">Classic MVVM: data binding, and still no memory of why</text>
<text x="40" y="155.4" text-anchor="start" font-size="22" font-weight="400" fill="#4B5563">The View binds to the ViewModel, which calls the Model and is notified of changes.</text>
<text x="40" y="184.0" text-anchor="start" font-size="22" font-weight="400" fill="#4B5563">A different pattern from MVC, the same gap: nothing records the reasoning.</text>
<rect x="40" y="346" width="220" height="64" rx="14" fill="#F3F4F6" fill-opacity="1" stroke="#6B7280" stroke-width="3"/>
