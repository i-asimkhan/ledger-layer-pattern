<text x="252" y="413.4" text-anchor="start" font-size="24" font-weight="400" fill="#111827">record</text>
<rect x="382" y="392" width="26" height="26" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
<text x="418" y="413.4" text-anchor="start" font-size="24" font-weight="400" fill="#111827">human decision</text>
<rect x="678" y="392" width="26" height="26" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/>
<text x="714" y="413.4" text-anchor="start" font-size="24" font-weight="400" fill="#111827">audit</text>
<text x="40" y="460.2" text-anchor="start" font-size="26" font-weight="400" fill="#111827">Ledger means a record of decisions kept with the code.</text>
<text x="40" y="494.0" text-anchor="start" font-size="26" font-weight="400" fill="#111827">It is not a blockchain.</text>
<text x="40" y="551.8" text-anchor="start" font-size="28" font-weight="700" fill="#78350F">The harder a change is to undo, the deeper the audit.</text>
