<rect width="1200" height="627" fill="#FFFFFF"/>
<text x="40" y="72.2" text-anchor="start" font-size="32" font-weight="700" fill="#111827">The Ledger layer creates the evidence. Audit gives it meaning.</text>
<rect x="40" y="98" width="1120" height="56" rx="14" fill="#FEE2E2" fill-opacity="1" stroke="#DC2626" stroke-width="3"/>
<text x="600.0" y="133.7" text-anchor="middle" font-size="22" font-weight="700" fill="#7F1D1D">4  AUDIT LAYER: independent auditors check the record against the work</text>
<rect x="40" y="178" width="1120" height="56" rx="14" fill="#E2E8F0" fill-opacity="1" stroke="#334155" stroke-width="3"/>
<text x="600.0" y="213.7" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">3  GATE: no signed, audited record, no merge</text>
<rect x="40" y="258" width="1120" height="56" rx="14" fill="#FEF3C7" fill-opacity="1" stroke="#D97706" stroke-width="3"/>
<text x="600.0" y="293.7" text-anchor="middle" font-size="22" font-weight="700" fill="#78350F">2  ATTEST: the builder reviews, edits and signs the record</text>
<rect x="40" y="338" width="200" height="56" rx="14" fill="#F3F4F6" fill-opacity="1" stroke="#6B7280" stroke-width="3"/>
<text x="140.0" y="373.7" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Model</text>
<polyline points="240,366 300,366" fill="none" stroke="#7C3AED" stroke-width="4" stroke-linejoin="round" marker-end="url(#m7C3AED)"/>
<rect x="40" y="418" width="200" height="56" rx="14" fill="#F3F4F6" fill-opacity="1" stroke="#6B7280" stroke-width="3"/>
<text x="140.0" y="453.7" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">View</text>
<polyline points="240,446 300,446" fill="none" stroke="#7C3AED" stroke-width="4" stroke-linejoin="round" marker-end="url(#m7C3AED)"/>
<rect x="40" y="498" width="200" height="56" rx="14" fill="#F3F4F6" fill-opacity="1" stroke="#6B7280" stroke-width="3"/>
<text x="140.0" y="533.7" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Controller</text>
<polyline points="240,526 300,526" fill="none" stroke="#7C3AED" stroke-width="4" stroke-linejoin="round" marker-end="url(#m7C3AED)"/>
<text x="270.0" y="349.9" text-anchor="middle" font-size="14" font-weight="700" fill="#7C3AED">changes</text>
<rect x="300" y="338" width="270" height="216" rx="14" fill="#EDE9FE" fill-opacity="1" stroke="#7C3AED" stroke-width="3"/>
<text x="435.0" y="399.8" text-anchor="middle" font-size="24" font-weight="700" fill="#2E1065">1  LEDGER LAYER</text>
<text x="435.0" y="427.4" text-anchor="middle" font-size="21" font-weight="400" fill="#2E1065">drafts the record,</text>
<text x="435.0" y="454.7" text-anchor="middle" font-size="21" font-weight="400" fill="#2E1065">the diagram update,</text>
<text x="435.0" y="482.0" text-anchor="middle" font-size="21" font-weight="400" fill="#2E1065">the spec link and</text>
<text x="435.0" y="509.3" text-anchor="middle" font-size="21" font-weight="400" fill="#2E1065">a hash of the change</text>
<rect x="630" y="338" width="530" height="104" rx="14" fill="#CCFBF1" fill-opacity="1" stroke="#0D9488" stroke-width="3"/>
<text x="895.0" y="385.4" text-anchor="middle" font-size="24" font-weight="700" fill="#134E4A">RECORD, in the repo</text>
<text x="895.0" y="412.0" text-anchor="middle" font-size="20" font-weight="400" fill="#134E4A">decision, diagram, spec link, change hash</text>
<polyline points="570,390 630,390" fill="none" stroke="#7C3AED" stroke-width="4" stroke-linejoin="round" marker-end="url(#m7C3AED)"/>
<rect x="572.5" y="355" width="55" height="26" rx="6" fill="#FFFFFF"/>
<text x="600.0" y="372.9" text-anchor="middle" font-size="14" font-weight="700" fill="#7C3AED">drafts</text>
<text x="630" y="489.3" text-anchor="start" font-size="18" font-weight="700" fill="#78350F">The harder a change is to undo, the deeper the audit.</text>
<text x="630" y="524.6" text-anchor="start" font-size="18" font-weight="400" fill="#4B5563">Ledger means a record of decisions kept with</text>
<text x="630" y="548.0" text-anchor="start" font-size="18" font-weight="400" fill="#4B5563">the code. It is not a blockchain.</text>
</svg>