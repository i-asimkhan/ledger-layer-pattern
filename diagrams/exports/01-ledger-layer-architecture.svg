<rect width="1200" height="627" fill="#FFFFFF"/>
<text x="40" y="51.2" text-anchor="start" font-size="35" font-weight="700" fill="#111827">The Ledger layer creates the evidence. Audit gives it meaning.</text>
<rect x="30" y="72" width="1140" height="82" rx="14" fill="#FEE2E2" fill-opacity="1" stroke="#DC2626" stroke-width="3"/>
<text x="600.0" y="107.3" text-anchor="middle" font-size="32" font-weight="700" fill="#7F1D1D">4  AUDIT LAYER</text>
<text x="600.0" y="142.1" text-anchor="middle" font-size="26" font-weight="400" fill="#7F1D1D">independent auditors check the record against the work</text>
<rect x="30" y="162" width="1140" height="82" rx="14" fill="#E2E8F0" fill-opacity="1" stroke="#334155" stroke-width="3"/>
<text x="600.0" y="197.3" text-anchor="middle" font-size="32" font-weight="700" fill="#0F172A">3  GATE</text>
<text x="600.0" y="232.1" text-anchor="middle" font-size="26" font-weight="400" fill="#0F172A">no signed, audited record, no merge</text>
<rect x="30" y="252" width="1140" height="82" rx="14" fill="#FEF3C7" fill-opacity="1" stroke="#D97706" stroke-width="3"/>
<text x="600.0" y="287.3" text-anchor="middle" font-size="32" font-weight="700" fill="#78350F">2  ATTEST</text>
<text x="600.0" y="322.1" text-anchor="middle" font-size="26" font-weight="400" fill="#78350F">the builder reviews, edits and signs the record</text>
<rect x="30" y="346" width="220" height="56" rx="14" fill="#F3F4F6" fill-opacity="1" stroke="#6B7280" stroke-width="3"/>
<text x="140.0" y="383.8" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">Model</text>
<polyline points="250,374 320,374" fill="none" stroke="#7C3AED" stroke-width="4" stroke-linejoin="round" marker-end="url(#m7C3AED)"/>
<rect x="30" y="410" width="220" height="56" rx="14" fill="#F3F4F6" fill-opacity="1" stroke="#6B7280" stroke-width="3"/>
<text x="140.0" y="447.8" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">View</text>
<polyline points="250,438 320,438" fill="none" stroke="#7C3AED" stroke-width="4" stroke-linejoin="round" marker-end="url(#m7C3AED)"/>
<rect x="30" y="474" width="220" height="56" rx="14" fill="#F3F4F6" fill-opacity="1" stroke="#6B7280" stroke-width="3"/>
<text x="140.0" y="511.8" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">Controller</text>
<polyline points="250,502 320,502" fill="none" stroke="#7C3AED" stroke-width="4" stroke-linejoin="round" marker-end="url(#m7C3AED)"/>
<text x="285.0" y="347.6" text-anchor="middle" font-size="16" font-weight="700" fill="#7C3AED">changes</text>
<rect x="320" y="346" width="290" height="184" rx="14" fill="#EDE9FE" fill-opacity="1" stroke="#7C3AED" stroke-width="3"/>
<text x="465.0" y="385.4" text-anchor="middle" font-size="28" font-weight="700" fill="#2E1065">1  LEDGER LAYER</text>
<text x="465.0" y="417.1" text-anchor="middle" font-size="24" font-weight="400" fill="#2E1065">drafts the record,</text>
<text x="465.0" y="448.3" text-anchor="middle" font-size="24" font-weight="400" fill="#2E1065">the diagram update,</text>
<text x="465.0" y="479.5" text-anchor="middle" font-size="24" font-weight="400" fill="#2E1065">the spec link and</text>
<text x="465.0" y="510.7" text-anchor="middle" font-size="24" font-weight="400" fill="#2E1065">a hash of the change</text>
<rect x="680" y="346" width="490" height="184" rx="14" fill="#CCFBF1" fill-opacity="1" stroke="#0D9488" stroke-width="3"/>
<text x="925.0" y="414.7" text-anchor="middle" font-size="30" font-weight="700" fill="#134E4A">RECORD, in the repo</text>
<text x="925.0" y="448.9" text-anchor="middle" font-size="26" font-weight="400" fill="#134E4A">decision, diagram,</text>
<text x="925.0" y="482.8" text-anchor="middle" font-size="26" font-weight="400" fill="#134E4A">spec link, change hash</text>
<polyline points="610,438 680,438" fill="none" stroke="#7C3AED" stroke-width="4" stroke-linejoin="round" marker-end="url(#m7C3AED)"/>
<text x="645.0" y="424.3" text-anchor="middle" font-size="18" font-weight="700" fill="#7C3AED">drafts</text>
<text x="30" y="555.7" text-anchor="start" font-size="22" font-weight="400" fill="#4B5563">Your application, any architecture pattern</text>
<text x="30" y="588.1" text-anchor="start" font-size="26" font-weight="700" fill="#78350F">The harder a change is to undo, the deeper the audit.</text>
<text x="30" y="615.7" text-anchor="start" font-size="22" font-weight="400" fill="#111827">Ledger means a record of decisions kept with the code. It is not a blockchain.</text>
</svg>