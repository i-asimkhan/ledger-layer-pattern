<text x="380.0" y="198.0" text-anchor="middle" font-size="28" font-weight="700" fill="#2E1065">LEDGER LAYER</text>
<text x="380.0" y="228.7" text-anchor="middle" font-size="23" font-weight="400" fill="#2E1065">sits beside the app</text>
<text x="380.0" y="258.6" text-anchor="middle" font-size="23" font-weight="400" fill="#2E1065">drafts the record,</text>
<text x="380.0" y="288.5" text-anchor="middle" font-size="23" font-weight="400" fill="#2E1065">diagram and spec link</text>
<text x="380.0" y="318.4" text-anchor="middle" font-size="23" font-weight="400" fill="#2E1065">for every change</text>
<rect x="540" y="140" width="210" height="100" rx="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="3"/>
<text x="645.0" y="184.2" text-anchor="middle" font-size="28" font-weight="700" fill="#134E4A">RECORD</text>
<text x="645.0" y="215.9" text-anchor="middle" font-size="24" font-weight="400" fill="#134E4A">lives in the repo</text>
<rect x="540" y="256" width="210" height="100" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
<text x="645.0" y="300.2" text-anchor="middle" font-size="28" font-weight="700" fill="#78350F">ATTEST</text>
<text x="645.0" y="331.9" text-anchor="middle" font-size="24" font-weight="400" fill="#78350F">builder signs</text>
<rect x="785" y="256" width="385" height="100" rx="14" fill="#E2E8F0" stroke="#334155" stroke-width="3"/>
<text x="977.5" y="300.2" text-anchor="middle" font-size="28" font-weight="700" fill="#0F172A">GATE</text>
<text x="977.5" y="331.9" text-anchor="middle" font-size="24" font-weight="400" fill="#0F172A">no audited record, no merge</text>
<rect x="785" y="140" width="385" height="100" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/>
<text x="977.5" y="184.2" text-anchor="middle" font-size="28" font-weight="700" fill="#7F1D1D">AUDIT LAYER</text>
<text x="977.5" y="215.9" text-anchor="middle" font-size="24" font-weight="400" fill="#7F1D1D">checks the record vs. the work</text>
