<text x="40" y="56.2" text-anchor="start" font-size="35" font-weight="700" fill="#111827">The Ledger layer creates the evidence. Audit gives it meaning.</text>
<text x="30" y="132.7" text-anchor="start" font-size="22" font-weight="400" fill="#4B5563">Your application</text>
<rect x="30" y="140" width="190" height="64" rx="14" fill="#F3F4F6" stroke="#6B7280" stroke-width="3"/>
<text x="125.0" y="181.1" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">Model</text>
