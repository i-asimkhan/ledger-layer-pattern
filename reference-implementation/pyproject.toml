[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-gate"
version = "0.1.0"
description = "Reference implementation of the Ledger layer and audit gate (a demo of the pattern, not a product)"
requires-python = ">=3.9"
dependencies = ["pyyaml>=6"]
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
ledger = "ledger.cli:main"

[tool.setuptools]
packages = ["ledger"]
