name: "Ledger gate"
description: "Fail a pull request when a changed file has no signed, audited Ledger record, or when the record no longer matches the code."
author: "Asim Khan"

inputs:
  base:
    description: "Branch to compare against. Default: the pull request's base branch."
    required: false
    default: ""
  root:
    description: "Project root, the folder that holds ledger.yml."
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install the ledger gate
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}/reference-implementation"
    - name: Run the gate
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        INPUT_ROOT: ${{ inputs.root }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        base="${INPUT_BASE}"
        if [ -z "$base" ]; then
          if [ -z "${BASE_REF}" ]; then
            echo "::error::Run this action on pull_request events, or set the 'base' input."
            exit 1
          fi
          base="origin/${BASE_REF}"
        fi
        # Make the base branch and its history available, so a plain actions/checkout (depth 1) is enough.
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          git fetch --no-tags --quiet --unshallow
        fi
        case "$base" in
          origin/*) git fetch --no-tags --quiet origin "+refs/heads/${base#origin/}:refs/remotes/${base}" ;;
        esac
        ledger --root "$INPUT_ROOT" check --base "$base"
